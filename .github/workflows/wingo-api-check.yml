name: Wingo API Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Wingo API
        env:
          API_KEY: ${{ secrets.WINGOBOT_API_KEY }}
        run: |
          set -e
          if [ -z "$API_KEY" ]; then
            echo "WINGOBOT_API_KEY secret missing"
            exit 1
          fi

          BASE="https://server.wingoaibot.com"

          for ENDPOINT in \
            "/api/v1/me" \
            "/api/v1/history/1min?page=1&limit=5" \
            "/api/v1/history/30sec?page=1&limit=5"
          do
            echo "===== $ENDPOINT ====="
            CODE=$(curl -sS --max-time 25 \
              -o /tmp/wingo.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $API_KEY" \
              "$BASE$ENDPOINT")
            echo "HTTP STATUS: $CODE"
            cat /tmp/wingo.json
            echo
          done
