<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Game Analyzer - Pro Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-xl mx-auto p-4 sm:p-6 pb-12">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-black bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">UNIVERSAL ANALYZER</h1>
                <p class="text-xs text-slate-400">Pro Win/Loss Backtesting Engine</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold rounded-full animate-pulse">● Live Engine</span>
        </header>

        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block">Total Played</span>
                <span id="statTotal" class="text-lg font-black text-slate-200">0</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block">Wins / Loss</span>
                <span id="statWinLoss" class="text-lg font-black text-emerald-400">0 / 0</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 block">Net P/L (₹100/t)</span>
                <span id="statProfit" class="text-lg font-black text-slate-300">₹0</span>
            </div>
        </div>

        <!-- Live Simulation Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center mb-6 shadow-xl shadow-emerald-950/20">
            <div class="flex justify-between text-xs text-slate-400 mb-2">
                <span>Period: <strong id="currentPeriod" class="text-slate-200">--</strong></span>
                <span>Next Round in: <strong id="timerCountdown" class="text-emerald-400 font-mono">30s</strong></span>
            </div>
            <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-1">Active AI Signal</h2>
            <div id="activeSignal" class="text-4xl font-black text-emerald-400 mb-3">WAITING...</div>
            <p id="signalSubtext" class="text-xs text-slate-400">Analyzing trend patterns...</p>
        </div>

        <!-- History & Result Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 class="text-sm font-bold text-slate-300 mb-3 border-b border-slate-800 pb-2 flex justify-between items-center">
                <span>Round-by-Round Result Log</span>
                <span id="winRateBadge" class="text-xs bg-slate-800 px-2 py-0.5 rounded text-teal-400">Win Rate: 0%</span>
            </h3>
            <div id="historyLog" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                <div class="text-center text-xs text-slate-500 py-4">Waiting for first completed round...</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
