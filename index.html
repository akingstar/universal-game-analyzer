<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Game Analyzer - Fast Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-xl mx-auto p-4 sm:p-6 pb-12">
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-black text-emerald-400">UNIVERSAL ANALYZER</h1>
                <p class="text-xs text-slate-400">Fast Match Engine</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-semibold rounded-full">● Online</span>
        </header>

        <!-- Input Panel -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 shadow-xl">
            <label class="text-xs font-bold text-slate-300 block mb-2">Current Period Number</label>
            <input type="text" id="periodInput" value="20261107100050465" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-sm text-emerald-400 font-mono mb-3 focus:outline-none focus:border-emerald-500">
            
            <label class="text-xs font-bold text-slate-300 block mb-2">Select Actual Real Outcome</label>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="recordResult('BIG')" class="py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black rounded-xl text-sm cursor-pointer shadow-lg shadow-emerald-500/20">BIG</button>
                <button onclick="recordResult('SMALL')" class="py-3.5 bg-rose-500 hover:bg-rose-600 text-slate-950 font-black rounded-xl text-sm cursor-pointer shadow-lg shadow-rose-500/20">SMALL</button>
            </div>
        </div>

        <!-- Prediction Display -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center mb-6 shadow-xl">
            <span class="text-xs uppercase tracking-widest text-slate-400 block mb-1">Next AI Signal</span>
            <div id="signalBox" class="text-5xl font-black text-emerald-400 mb-2">BIG</div>
            <p class="text-xs text-slate-400">Win Rate: <span id="winRate" class="text-teal-400 font-bold">0%</span> | Net P/L: <span id="netPL" class="text-slate-200 font-bold">₹0</span></p>
        </div>

        <!-- History Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h3 class="text-xs font-bold text-slate-400 mb-3 border-b border-slate-800 pb-2">Matched History Log</h3>
            <div id="historyLog" class="space-y-2 max-h-60 overflow-y-auto">
                <div class="text-center text-xs text-slate-500 py-3">No rounds recorded yet.</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
