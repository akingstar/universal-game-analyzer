<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Game Analyzer - AI Signal Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-black bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">UNIVERSAL ANALYZER</h1>
                <p class="text-xs text-slate-400">AI Signal & Pattern Engine</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold rounded-full animate-pulse">● Live Active</span>
        </header>

        <!-- Main Signal Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center mb-6 shadow-xl shadow-emerald-950/20">
            <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-2">Current Period Signal</h2>
            <div id="signalResult" class="text-4xl font-black text-emerald-400 mb-3">Analyzing...</div>
            <div class="flex justify-center gap-4 text-sm text-slate-300">
                <span class="bg-slate-800 px-3 py-1 rounded-lg">Confidence: <strong id="confidenceScore" class="text-teal-400">--%</strong></span>
                <span class="bg-slate-800 px-3 py-1 rounded-lg">Trend: <strong id="trendType" class="text-emerald-400">--</strong></span>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="generateSignal()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 font-bold text-slate-950 rounded-xl shadow-lg transition-all mb-6 cursor-pointer">
            Generate New Signal
        </button>

        <!-- History & Statistics Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
            <h3 class="text-sm font-bold text-slate-300 mb-3 border-b border-slate-800 pb-2">Recent Pattern Log</h3>
            <div id="historyLog" class="space-y-2 text-xs">
                <div class="flex justify-between text-slate-500"><span>No signals generated yet.</span><span>-</span></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
